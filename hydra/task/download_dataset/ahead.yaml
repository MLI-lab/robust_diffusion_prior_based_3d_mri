defaults:
  - base
  - _self_

dataset_name: ahead

raw_subfolder: ahead

download:
  mode: url_csv
  exists_ok: true
  timeout: 120
  num_workers: 4
  worker_backend: mp
  validate_hdf5: true
  url_csv_paths:
    train: hydra/task/download_dataset/urls/ahead_train_url.csv
    test_val: hydra/task/download_dataset/urls/ahead_test_val_url.csv
  max_files: null
  max_files_per_fold: null
