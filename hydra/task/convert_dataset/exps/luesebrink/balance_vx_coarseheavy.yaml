# @package _global_
conversion:
  subset_name: balance_vx_coarseheavy
  subset_model:
    train:
      source: train_pool
      resolution_groups:
      - resolutions: [0.5]
        volume_limit: 1
        distribute_volume_limit_by_resolution: true
        allow_short_resolution_groups: true
      - resolutions: [0.6]
        volume_limit: 2
        distribute_volume_limit_by_resolution: true
        allow_short_resolution_groups: true
      - resolutions: [0.7]
        volume_limit: 3
        distribute_volume_limit_by_resolution: true
        allow_short_resolution_groups: true
      - resolutions: [0.8]
        volume_limit: 3
        distribute_volume_limit_by_resolution: true
        allow_short_resolution_groups: true
      - resolutions: [1.0]
        volume_limit: 5
        distribute_volume_limit_by_resolution: true
        allow_short_resolution_groups: true
    test_val:
      source: test_val_pool
      resolutions: [0.5, 0.6, 0.7, 0.8, 1.0]
