# @package _global_
defaults:
  - /dataset: prepped_fastmri_3d
  - override /problem_trafos/fwd_trafo: mri3d
  - override /problem_trafos/target_trafo: crop_mag
  - override /problem_trafos/prior_trafo: crop_mag
  - override /problem_trafos/dataset_trafo: prepared_mri3d_recon
  - override /representation: identity

problem_trafos:
  prior_trafo:
    scaling_factor: 1.0
    move_axis: [-1, 1]
  dataset_trafo:
    sampling_kind: cartesian

sample_logger:
  volume_stats_period: 10
  volume_stats__wandb_take_mean_slice_period: 10

dataset:
  fold: test
  data_object_type: volumes

representation:
  mesh_data:
    field_of_view: [1.0, 1.0, 1.0]

diffmodels:
  use_ema: true
  model_use_ema: true
  model_from_epoch: -1
