# @package _global_
defaults:
  - /dataset: prepped_fastmri_2d
  - override /problem_trafos/fwd_trafo: null
  - override /problem_trafos/target_trafo: null
  - override /problem_trafos/prior_trafo: crop_mag
  - override /problem_trafos/dataset_trafo: mri2d_train_rss

problem_trafos:
  prior_trafo:
    magnitude_enabled: False
    move_axis: [-1, 1]
    collapse_singleton_complex_channel: True
    stack_channel_into_batchdim: False
    scaling_factor: 1.0
  dataset_trafo:
    scale_target_by_kspacenorm: False
    target_interpolate_by_factor: 1.0

dataset:
  fold: train
  data_object_type: slices
