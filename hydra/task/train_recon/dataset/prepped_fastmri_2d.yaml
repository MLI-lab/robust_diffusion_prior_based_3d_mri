defaults:
  - fastmri_base

data_path_train: null
data_path_val:   null
data_path_recon:  null

data_path_sensmaps_train: null
data_path_sensmaps_val:   null
data_path_sensmaps_recon:  null

volume_filter_train: '.*\.h5'
volume_filter_val:   '.*\.h5'
volume_filter_test:  '.*\.h5'

challenge: multicoil
data_object_type: slices

readout_dim: 0
readout_dim_is_spatial: True
readout_dim_keep_spatial: False
apply_fft1c_on_readout_dim: False
apply_fft1c_on_readout_dim_shifts: [True, True]
dataset_is_3d: True

sensemap_3d_slice_from_fixed_view: False
sensmap_coil_dim_first: False
transpose_2D_slice: [False, False, False]

recons_key: reconstruction_mvue