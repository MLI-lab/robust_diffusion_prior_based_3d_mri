train:
  batch_size: 4
  epochs: 200
  training_steps: null
  log_freq: 10
  n_log_total: 10
  save_model_every_n_epoch: 5
  n_save_total: 10
  use_ema: true
  ema_warm_start_steps: 500
  ema_decay: 0.999
  lr: 1e-4
  cache_dataset: False
  cache_dataset_in_gpu: False
  cache_dataset_load_from_disk: False
  cache_dataset_store_on_disk: False
  cache_dataset_disk_path: null
  cache_dataset_repeats: 1
  use_batch_sampler_same_shape: True
  group_shape_by: 'target'
  shuffle: True
  num_workers: 0
  log_dataset_stats_before_training:
    enabled: False
    num_dataloader_stat_samples: -1
    num_dataloader_image_samples: 20

val:
  batch_size: 4
  sample_freq: 1
  n_eval_total: 10
  n_sample_total: 10
  num_img_in_sample_log: 5
  group_shape_by: 'target'
  shuffle: True
  num_workers: 0
  cache_dataset: False
  cache_dataset_in_gpu: False
  cache_dataset_repeats: 1 
  cache_dataset_load_from_disk: False
  cache_dataset_store_on_disk: False
  cache_dataset_disk_path: null
  use_batch_sampler_same_shape: True