name: tuned_recon_protocol_flow
protocol:
  mode: index_holdout
  smoke_test: false
data:
  source:
    enabled: true
    download:
      config_path: task/download_dataset
      config_name: stanford_3d
      overrides: []
      sweep: {}
      cache_refresh: false
      num_gpus: 0
    conversion:
      shared:
        config_path: task/convert_dataset
        config_name: stanford_3d
        overrides:
        - ++conversion.num_workers=4
        - ++conversion.version=v2
        sweep: {}
        cache_refresh: false
        num_gpus: 0
      train: null
      recon: null
  preprocess:
    train:
      config_path: task/preprocess_dataset
      config_name: stanford_3d_train
      overrides: []
      sweep:
        +exps:
        - stanford_3d/1mm
        - stanford_3d/0_5mm
        - stanford_3d/diverse_step_0125
      cache_refresh: false
      num_gpus: 1
    recon:
      config_path: task/preprocess_dataset
      config_name: stanford_3d_recon_cartesian
      overrides:
      - ++preprocess.mask_type='Poisson2D'
      - ++preprocess.target_interpolate_by_factor=1.0
      - ++preprocess.num_workers=4
      sweep:
        ++preprocess.mask_accelerations:
        - 4.0
        - 8.0
        - 16.0
        - 24.0
        - 36.0
        - 48.0
      cache_refresh: false
      num_gpus: 1
model:
  train:
    config_path: task/train_recon
    config_name: base_train
    overrides:
    - +exps=prepped/train_dense
    sweep: {}
    cache_refresh: false
    num_gpus: 1
    post_overrides:
    - ++diffmodels.train.training_steps=50000
    - ++diffmodels.train.batch_size=8
    - ++diffmodels.val.batch_size=8
reconstruction:
  config_path: task/train_recon
  config_name: base_recon
  overrides:
  - +exps=prepped/base_recon
  post_overrides:
  - ++problem_trafos.prior_trafo.scaling_factor=1.0
  - ++problem_trafos.prior_trafo.normalize_enabled=False
  - ++problem_trafos.fwd_trafo.sensitivitymaps_fillouter=True
  - ++sample_logger.volume_stats__wandb_take_mean_slice_period=999999
  - ++sample_logger.volume_stats__wandb_video_period=999999
  - ++reconstruction.variational.fitting.optimizer.iterations=200
  method_sweep:
    +rec_method:
    - varrecon_voxelrep_diffprior
  common_overrides:
  - ++seed=1
  common_post_overrides: []
  prior_mesh_scale:
    enabled: true
  hp_sharing:
    assume_same:
      - ++preprocess.mask_accelerations
    representative:
      preprocess.mask_accelerations: 4.0
  tuning:
    selection_config_path: task/tuning_selection
    selection_config_name: config
    selection_overrides:
    - ++selection_method=best_overall
    - ++tune_metric=rec_psnr
    - ++tune_metric_take_max=True
    - ++secondary_mode=none
    hp_overrides:
    - ++sample_logger.save_final_sample=False
    hp_sweep_key: sweep
    hp_sweep_extra: {}
    hp_log_wandb: false
    coarse_budget_trials_per_param: 16
    refine_budget_trials_per_param: 4
    cache_refresh: false
    num_gpus: 1
    aggregate_sweep: {}
  evaluation:
    sweep: {}
    run_overrides:
    - ++sample_logger.save_final_sample=False
    cache_refresh: false
    num_gpus: 1
  visual_evaluation:
    sweep: {}
    overrides_extra:
    - ++sample_logger.save_final_sample=True
    - ++sample_logger.save_ground_truth=True
    cache_refresh: false
    num_gpus: 1
    save_result_enable: null
reporting:
  sweep_plot:
    config_path: task/plot
    config_name: seaborn_sweep_plot
    overrides:
    - '++pivot_tables=[{name:training_set_metrics,title:"stanford_3d recon at 0.5 mm - training-set fixes",metrics:[rec_psnr,rec_ssim],rows:["preprocess_train.+exps"],cols:["train.+exps"],agg:[mean],include_std:false,decimals:3}]'
    num_gpus: 1
    split_params: []
  visual_plot:
    enabled: true
    config_path: task/plot_visual_3d
    config_name: config
    overrides:
    - ++auto_zoom_enabled=true
    - ++auto_zoom_grouping_key=++preprocess.mask_accelerations
    - ++auto_zoom_scoring_mode=disagreement_only
    - ++auto_zoom_search_stride=2
    - ++zoom_size_frac=0.20
    - ++metric_overlay_metrics=[rec_psnr, rec_ssim]
    num_gpus: 1
    split_params: []
  aggregate_plot:
    enabled: true
    overrides:
    - ++stochastic_params=["++sample_idx", "holdout_idx"]
    num_gpus: 1
    name_aux: aggregate_cross_holdout
holdout:
  index:
    values:
    - 0
    - 1
    - 2
    - 3
    split_key: ++sample_idx
  label:
    values: []
    split_key: ++sample_idx
smoke:
  enabled: false
  overrides:
    data:
      download_overrides:
      - ++download.max_files_per_fold=2
      conversion_overrides:
      - ++conversion.version=smoke_v1
      conversion_sweep: null
      train_conversion_overrides: null
      train_conversion_sweep: null
      recon_conversion_overrides: null
      recon_conversion_sweep: null
      preprocess_train_overrides:
      - ++preprocess.volume_limit=2
      - ++preprocess.visualize.enabled=True
      - ++preprocess.visualize.num_volumes=1
      preprocess_recon_overrides:
      - ++preprocess.volume_limit=2
      - ++preprocess.visualize.enabled=True
      - ++preprocess.visualize.num_volumes=1
      preprocess_recon_sweep:
        ++preprocess.mask_accelerations:
        - 16.0
    model:
      train_post_overrides:
      - ++diffmodels.train.training_steps=10
      - ++diffmodels.train.n_log_total=2
      - ++diffmodels.train.n_save_total=2
      - ++diffmodels.val.n_eval_total=2
      - ++diffmodels.val.n_sample_total=2
      - ++diffmodels.sampler.num_steps=10
    reconstruction:
      post_overrides:
      - ++reconstruction.variational.fitting.optimizer.iterations=2
      method_sweep:
        +rec_method:
        - varrecon_voxelrep_diffprior
      aggregate_sweep: null
      evaluation_sweep: null
      visual_evaluation_sweep: null
      coarse_budget_trials_per_param: 1
      refine_budget_trials_per_param: 1
    reporting:
      visual_plot_enabled: true
      aggregate_plot_enabled: false
    holdout:
      index_values:
      - 0
      - 1
      label_values: null
